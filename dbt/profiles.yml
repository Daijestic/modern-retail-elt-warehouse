modern_retail_elt_warehouse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'retail_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'retail_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'retail_dw') }}"
      schema: analytics
      threads: 4
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'retail_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'retail_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'retail_dw') }}"
      schema: analytics
      threads: 4

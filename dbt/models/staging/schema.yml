version: 2

models:
  - name: stg_customers
    description: "Cleaned customer records from raw customer data."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned order records with standardized status and timestamps."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - created
                - approved
                - processing
                - shipped
                - delivered
                - canceled
                - unavailable
                - invoiced

  - name: stg_order_items
    description: "Cleaned order item records at order-item grain."
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned product catalog records."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_category_name
        tests:
          - not_null

  - name: stg_payments
    description: "Cleaned payment records at order-payment-sequence grain."
    columns:
      - name: payment_key
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_shipments
    description: "Cleaned shipment and delivery date records."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: estimated_delivery_date
        tests:
          - not_null
version: 2

models:
  - name: stg_customers
    description: "Các dòng khách hàng đã được chuẩn hóa từ snapshot landing đã được kiểm soát."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        tests:
          - not_null
      - name: landing_ingested_at
        tests:
          - not_null

  - name: stg_orders
    description: "Các dòng đơn hàng đã được chuẩn hóa. Những khóa nghiệp vụ trùng lặp bị loại trong lúc ingestion và được audit trong metadata.ingestion_rejections."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - created
                  - approved
                  - processing
                  - shipped
                  - delivered
                  - canceled
                  - unavailable
                  - invoiced

  - name: stg_order_items
    description: "Các dòng order item đã được chuẩn hóa ở grain order-item."
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: price
        tests:
          - not_null
      - name: freight_value
        tests:
          - not_null

  - name: stg_products
    description: "Các dòng danh mục sản phẩm đã được chuẩn hóa."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_category_name
        tests:
          - not_null

  - name: stg_payments
    description: "Các dòng thanh toán đã được chuẩn hóa ở grain order-payment-sequence."
    columns:
      - name: payment_key
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  - name: stg_shipments
    description: "Các dòng giao hàng đã được chuẩn hóa và căn chỉnh theo grain đơn hàng."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: estimated_delivery_date
        tests:
          - not_null

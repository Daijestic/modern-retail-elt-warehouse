version: 2

models:
  - name: dim_customers
    description: "Bảng dimension khách hàng ở grain customer_id."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null

  - name: dim_products
    description: "Bảng dimension sản phẩm ở grain product_id."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

      - name: product_category_name
        tests:
          - not_null

  - name: fact_order_items
    description: "Bảng fact ở grain order item."
    columns:
      - name: order_item_key
        tests:
          - not_null
          - unique

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: item_price
        tests:
          - not_null

      - name: freight_value
        tests:
          - not_null

      - name: line_total_amount
        tests:
          - not_null

  - name: fact_orders
    description: "Bảng fact ở grain đơn hàng."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_status
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: total_order_value
        tests:
          - not_null

version: 2

sources:
  - name: raw
    database: "{{ env_var('POSTGRES_DB', 'retail_dw') }}"
    schema: raw
    description: "Snapshot ở tầng landing đã được kiểm soát, được nạp bởi pipeline ingestion viết bằng Python."
    freshness:
      warn_after:
        count: 24
        period: hour
      error_after:
        count: 48
        period: hour
    loaded_at_field: ingested_at
    tables:
      - name: raw_customers
        description: "Snapshot khách hàng ở tầng landing, có kèm các cột provenance để truy vết nguồn."
        columns:
          - name: customer_id
            tests:
              - not_null
              - unique
          - name: _ingestion_run_id
            tests:
              - not_null
          - name: _source_row_number
            tests:
              - not_null
      - name: raw_orders
        description: "Snapshot đơn hàng ở tầng landing trước khi được ép kiểu dữ liệu ở tầng staging."
        columns:
          - name: order_id
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
          - name: order_status
            tests:
              - not_null
      - name: raw_order_items
        description: "Snapshot order item ở tầng landing, với một dòng hợp lệ cho mỗi khóa nghiệp vụ."
        columns:
          - name: order_id
            tests:
              - not_null
          - name: order_item_id
            tests:
              - not_null
          - name: price
            tests:
              - not_null
      - name: raw_products
        description: "Snapshot danh mục sản phẩm ở tầng landing."
        columns:
          - name: product_id
            tests:
              - not_null
              - unique
      - name: raw_payments
        description: "Snapshot thanh toán ở tầng landing."
        columns:
          - name: order_id
            tests:
              - not_null
          - name: payment_sequential
            tests:
              - not_null
          - name: payment_value
            tests:
              - not_null
      - name: raw_shipments
        description: "Snapshot giao hàng ở tầng landing."
        columns:
          - name: order_id
            tests:
              - not_null
              - unique
